<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Néerlandais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>TP Néerlandais</h2>

    <div class="controls">
        <!-- Menu de sélection de la face avant -->
        <select id="modeSelect">
            <option value="tr" selected>Traduction</option>
            <option value="inf">Infinitif</option>
            <option value="ovt">OVT (Imparfait)</option>
            <option value="vd">VD (Participe passé)</option>
        </select>
        
        <input type="text" id="search" placeholder="Rechercher...">
        <button id="shuffleBtn">🔀 Mélanger</button>
    </div>

    <div class="stats">
        <span id="counter">Carte 1 / 99</span>
    </div>

    <!-- Carte avec animation 3D -->
    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <!-- Face Avant -->
            <div class="card-face card-front">
                <div class="card-tag" id="frontTag">Verbe N° 1</div>
                <div>
                    <div class="main-term" id="frontTitle">cuire</div>
                    <div class="sub-term" id="frontSub">Traduction</div>
                </div>
                <div class="hint">💡 Cliquez pour retourner</div>
            </div>

            <!-- Face Arrière -->
            <div class="card-face card-back">
                <div class="card-tag">Réponse Complète</div>
                <div class="details" id="detailsContainer">
                    <!-- Les 3 autres éléments s'insèrent ici dynamiquement -->
                </div>
                <div class="hint">⬅️ Utilisez les flèches du clavier ➡️</div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button id="prevBtn">⬅️ Précédent</button>
        <button id="nextBtn">Suivant ➡️</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
